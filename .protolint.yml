lint:
  directories:
    exclude:
      - api/google

  # Linter rules.
  # Run `protolint list` to see all available rules.
  rules:
    # Determines whether or not to include the default set of linters.
    no_default: true

    # Set the default to all linters. This option works the other way around as no_default does.
    # If you want to enable this option, delete the comment out below and no_default.
    # all_default: true

    # The specific linters to add.
    add:
      - FILE_NAMES_LOWER_SNAKE_CASE
      - MAX_LINE_LENGTH
      - PACKAGE_NAME_LOWER_CASE
      - ENUM_FIELD_NAMES_UPPER_SNAKE_CASE
      - ENUM_FIELD_NAMES_ZERO_VALUE_END_WITH
      - ENUM_FIELDS_HAVE_COMMENT
      - ENUMS_HAVE_COMMENT
      - FIELD_NAMES_LOWER_SNAKE_CASE
      - FIELDS_HAVE_COMMENT
      - REPEATED_FIELD_NAMES_PLURALIZED
      - MESSAGE_NAMES_UPPER_CAMEL_CASE
      - MESSAGE_NAMES_EXCLUDE_PREPOSITIONS
      - MESSAGES_HAVE_COMMENT
      - RPC_NAMES_UPPER_CAMEL_CASE
      - RPCS_HAVE_COMMENT
      - SERVICE_NAMES_UPPER_CAMEL_CASE
      - SERVICE_NAMES_END_WITH
      - SERVICES_HAVE_COMMENT

  # Linter rules option.
  rules_option:
    # MAX_LINE_LENGTH rule option.
    max_line_length:
      # Enforces a maximum line length
      max_chars: 120
      # Specifies the character count for tab characters
      tab_chars: 4

    # ENUM_FIELD_NAMES_ZERO_VALUE_END_WITH rule option.
    enum_field_names_zero_value_end_with:
      suffix: UNSPECIFIED

    # SERVICE_NAMES_END_WITH rule option.
    service_names_end_with:
      text: Service

