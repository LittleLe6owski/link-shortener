kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
kubeadmConfigPatches:
- |
  apiVersion: kubelet.config.k8s.io/v1beta1
  kind: KubeletConfiguration
  # Speed up configmap propagation
  # See: https://kubernetes.io/docs/concepts/configuration/configmap/#mounted-configmaps-are-updated-automatically
  configMapAndSecretChangeDetectionStrategy: Get
  syncFrequency: 3s
  nodeRegistration:
    kubeletExtraArgs:
      node-labels: "configmap-cache: false"
nodes:
- role: control-plane
  image: kindest/node:v1.22.0
  kubeadmConfigPatches:
    - |
      kind: InitConfiguration
      nodeRegistration:
        kubeletExtraArgs:
          node-labels: "ingress-ready=true"
  extraPortMappings:
    - containerPort: 80
      hostPort: 80
      protocol: TCP
    - containerPort: 443
      hostPort: 443
      protocol: TCP
- role: worker
  image: kindest/node:v1.22.0
- role: worker
  image: kindest/node:v1.22.0
